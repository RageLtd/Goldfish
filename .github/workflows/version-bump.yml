name: Version Bump & Release

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  version-bump:
    name: Analyze & Bump Version
    runs-on: ubuntu-latest
    # Don't run on release commits to avoid infinite loops
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      should_release: ${{ steps.dry-run.outputs.should_release }}
      new_version: ${{ steps.dry-run.outputs.new_version }}
      bump_type: ${{ steps.dry-run.outputs.bump_type }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for tag detection
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Version Bump (Dry Run)
        id: dry-run
        run: |
          OUTPUT=$(bun scripts/release.ts --dry-run 2>&1)
          echo "$OUTPUT"

          # Extract version info
          if echo "$OUTPUT" | grep -q "Nothing to do"; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            NEW_VERSION=$(echo "$OUTPUT" | grep "Version:" | sed 's/.*→ //')
            BUMP_TYPE=$(echo "$OUTPUT" | grep "Bump type:" | sed 's/.*: //')
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          fi

      - name: Run Version Bump
        if: steps.dry-run.outputs.should_release == 'true'
        run: bun scripts/release.ts

      - name: Push Changes and Tags
        if: steps.dry-run.outputs.should_release == 'true'
        run: git push --follow-tags

      - name: Summary
        if: steps.dry-run.outputs.should_release == 'true'
        run: |
          echo "## 🚀 Version Bump Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version:** v${{ steps.dry-run.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type:** ${{ steps.dry-run.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY

      - name: No Release Needed
        if: steps.dry-run.outputs.should_release != 'true'
        run: |
          echo "## ℹ️ No Version Bump Needed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No conventional commits found that require a version bump." >> $GITHUB_STEP_SUMMARY

  build-llama:
    name: Build llama.cpp binaries
    needs: version-bump
    if: needs.version-bump.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            metal_flag: "-DGGML_METAL=ON"
          - os: ubuntu-latest
            target: linux-x64
            metal_flag: "-DGGML_METAL=OFF"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

      - name: Build llama.cpp
        run: |
          cd llama.cpp
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.metal_flag }} \
            -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build build --target llama-completion llama-embedding -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

      - name: Package
        run: |
          mkdir -p staging
          cp llama.cpp/build/bin/llama-completion staging/
          cp llama.cpp/build/bin/llama-embedding staging/
          # Copy shared libraries — location varies by platform:
          # Linux: build/bin/*.so, macOS: build/src/*.dylib + build/ggml/src/*.dylib
          cp llama.cpp/build/bin/libllama.* staging/ 2>/dev/null || true
          cp llama.cpp/build/bin/libggml*.* staging/ 2>/dev/null || true
          cp llama.cpp/build/src/libllama.* staging/ 2>/dev/null || true
          cp llama.cpp/build/ggml/src/libggml*.* staging/ 2>/dev/null || true
          ls -lh staging/
          tar czf llama-${{ matrix.target }}.tar.gz -C staging .

      - uses: actions/upload-artifact@v4
        with:
          name: llama-${{ matrix.target }}
          path: llama-${{ matrix.target }}.tar.gz

  build-release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: [version-bump, build-llama]
    if: needs.version-bump.outputs.should_release == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest (including version bump)
        run: git pull origin main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build claude-mem binaries
        run: |
          mkdir -p dist

          # macOS ARM64 (M1/M2/M3)
          bun build --compile --minify --target=bun-darwin-arm64 \
            src/cli.ts --outfile dist/claude-mem-darwin-arm64

          # Linux x64
          bun build --compile --minify --target=bun-linux-x64 \
            src/cli.ts --outfile dist/claude-mem-linux-x64

          ls -lh dist/

      - name: Download llama.cpp artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: llama-*
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-bump.outputs.new_version }}
          name: v${{ needs.version-bump.outputs.new_version }}
          files: |
            dist/claude-mem-darwin-arm64
            dist/claude-mem-linux-x64
            dist/llama-darwin-arm64.tar.gz
            dist/llama-linux-x64.tar.gz
          generate_release_notes: true

      - name: Release Summary
        run: |
          echo "## Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ needs.version-bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Assets:**" >> $GITHUB_STEP_SUMMARY
          echo "- claude-mem-darwin-arm64 (macOS M1/M2/M3)" >> $GITHUB_STEP_SUMMARY
          echo "- claude-mem-linux-x64" >> $GITHUB_STEP_SUMMARY
          echo "- llama-darwin-arm64.tar.gz (llama.cpp binaries)" >> $GITHUB_STEP_SUMMARY
          echo "- llama-linux-x64.tar.gz (llama.cpp binaries)" >> $GITHUB_STEP_SUMMARY
