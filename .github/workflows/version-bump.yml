name: Version Bump & Release

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  version-bump:
    name: Analyze & Bump Version
    runs-on: ubuntu-latest
    # Don't run on release commits to avoid infinite loops
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      should_release: ${{ steps.dry-run.outputs.should_release }}
      new_version: ${{ steps.dry-run.outputs.new_version }}
      bump_type: ${{ steps.dry-run.outputs.bump_type }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for tag detection
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Version Bump (Dry Run)
        id: dry-run
        run: |
          OUTPUT=$(bun scripts/release.ts --dry-run 2>&1)
          echo "$OUTPUT"

          # Extract version info
          if echo "$OUTPUT" | grep -q "Nothing to do"; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            NEW_VERSION=$(echo "$OUTPUT" | grep "Version:" | sed 's/.*→ //')
            BUMP_TYPE=$(echo "$OUTPUT" | grep "Bump type:" | sed 's/.*: //')
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          fi

      - name: Run Version Bump
        if: steps.dry-run.outputs.should_release == 'true'
        run: bun scripts/release.ts

      - name: Push Changes and Tags
        if: steps.dry-run.outputs.should_release == 'true'
        run: git push --follow-tags

      - name: Summary
        if: steps.dry-run.outputs.should_release == 'true'
        run: |
          echo "## 🚀 Version Bump Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version:** v${{ steps.dry-run.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type:** ${{ steps.dry-run.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY

      - name: No Release Needed
        if: steps.dry-run.outputs.should_release != 'true'
        run: |
          echo "## ℹ️ No Version Bump Needed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No conventional commits found that require a version bump." >> $GITHUB_STEP_SUMMARY

  build-binaries:
    name: Build (${{ matrix.platform }})
    needs: [version-bump]
    if: needs.version-bump.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest (including version bump)
        run: git pull origin main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build goldfish binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          bun build --compile --minify \
            src/cli.ts --outfile dist/goldfish-${{ matrix.platform }}
          ls -lh dist/

      - name: Build goldfish binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          bun build --compile --minify src/cli.ts --outfile dist/goldfish-${{ matrix.platform }}
          Get-ChildItem dist/

      - name: Sign binary (macOS)
        if: startsWith(matrix.platform, 'darwin')
        run: codesign --force --sign - dist/goldfish-${{ matrix.platform }}

      - name: Upload binary (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: goldfish-${{ matrix.platform }}
          path: dist/goldfish-${{ matrix.platform }}

      - name: Upload binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: goldfish-${{ matrix.platform }}
          path: dist/goldfish-${{ matrix.platform }}.exe

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version-bump, build-binaries]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version-bump.outputs.new_version }}
          name: v${{ needs.version-bump.outputs.new_version }}
          files: |
            dist/goldfish-darwin-arm64
            dist/goldfish-linux-x64
            dist/goldfish-windows-x64.exe
          generate_release_notes: true

      - name: Notify marketplace
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_PAT }}
          VERSION: ${{ needs.version-bump.outputs.new_version }}
        run: |
          gh api repos/RageLtd/claude-plugins/dispatches \
            -f event_type=plugin-release \
            -f "client_payload[plugin_name]=goldfish" \
            -f "client_payload[version]=$VERSION"

      - name: Release Summary
        run: |
          echo "## Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ needs.version-bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Assets:**" >> $GITHUB_STEP_SUMMARY
          echo "- goldfish-darwin-arm64 (macOS M1/M2/M3)" >> $GITHUB_STEP_SUMMARY
          echo "- goldfish-linux-x64" >> $GITHUB_STEP_SUMMARY
          echo "- goldfish-windows-x64.exe" >> $GITHUB_STEP_SUMMARY
